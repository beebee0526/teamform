# DB(Supabase) 일시정지 막기(3장 어려운 해결): 외부 예약 서비스(GitHub Actions)로 매일 DB에 질의를 보낸다.
# 저장소 Settings > Secrets and variables > Actions 에 DATABASE_URL 을 넣어 두어야 한다.
name: Supabase keepalive
on:
  schedule:
    - cron: "17 0 * * *"   # 매일 09:17 KST(00:17 UTC)
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query tf_settings
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          sudo apt-get install -y -qq postgresql-client > /dev/null
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -tAc "select 'keepalive', count(*) from tf_settings" > /dev/null
          echo "DB 질의 성공: $(date -u)"
